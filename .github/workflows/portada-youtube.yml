name: Portada de YouTube
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids de vídeos de YouTube separados por espacios"
        required: true
permissions:
  contents: write
jobs:
  portada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/portada_youtube.py
        env:
          IDS: ${{ inputs.ids }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/img
          git diff --cached --quiet || (git commit -m "Portadas de YouTube en docs/img" && git push)
