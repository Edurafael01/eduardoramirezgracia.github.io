# Descarga la foto de un antiguo alumno desde una URL y la deja lista en docs/img/alumnos/<id>.jpg
# (recorte 4:5, 800x1000). Se lanza a mano desde Actions o con la API.
name: Foto de alumno
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la foto"
        required: true
      id:
        description: "id del alumno en datos/alumnos.json"
        required: true
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Descargar y recortar
        env:
          URL: ${{ inputs.url }}
          ID: ${{ inputs.id }}
        run: |
          case "$ID" in *[!a-z0-9-]*|"") echo "id no válido"; exit 1;; esac
          curl -fsSL -A "Mozilla/5.0" -o /tmp/original "$URL"
          python -c "from PIL import Image; print('original', Image.open('/tmp/original').size)"
          python tools/foto_alumno.py /tmp/original "$ID"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/img/alumnos
          git diff --cached --quiet || (git commit -m "Foto de alumno: ${{ inputs.id }}" && git push)
