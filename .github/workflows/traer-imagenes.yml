name: Traer imágenes de Wix
on:
  push:
    paths: ["tools/traer_imagenes.py", ".github/workflows/traer-imagenes.yml", "build.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/traer_imagenes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/img
          git diff --cached --quiet || (git commit -m "Imágenes de Wix copiadas a docs/img" && git push)
